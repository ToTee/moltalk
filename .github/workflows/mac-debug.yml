# 맥에서 포장한 앱이 켜지자마자 꺼지는 원인을 가리기 위한 임시 확인용입니다.
name: mac-debug
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: node tools/build.mjs
      - name: 여러 방식으로 포장해 켜 보기
        run: |
          mkdir -p shots
          try() { # 이름, 나머지는 electron-builder 인자
            local n="$1"; shift
            npx electron-builder --mac dir "$@" -c.directories.output="out/$n" > "shots/build-$n.txt" 2>&1 || { echo "[$n] 빌드 실패"; tail -5 "shots/build-$n.txt"; return 0; }
            local app; app="$(ls -d out/$n/mac*/*.app | head -1)"
            codesign --force --deep --sign - "$app" > /dev/null 2>&1
            local code=0
            YJ_SHOT="$PWD/shots/$n.png" YJ_WAIT=3000 ELECTRON_ENABLE_LOGGING=1 "$app/Contents/MacOS/"* > "shots/run-$n.txt" 2>&1 || code=$?
            echo "[$n] 종료 코드 $code, 화면 $(ls shots/$n.png 2>/dev/null || echo 없음), 앱 $app"
            grep -iE 'fatal|integrity|error' "shots/run-$n.txt" | head -5 || true
          }
          try uni --universal
          try arm --arm64
          try arm-en --arm64 -c.productName=MolTalk
          try arm-noasar --arm64 -c.asar=false
          try uni-en --universal -c.productName=MolTalk
          sleep 5
          cp ~/Library/Logs/DiagnosticReports/* shots/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: shots
